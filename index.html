<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanzo OK</title>
<style>
:root {
  --bg: #fbfaf7; --text: #23201b; --muted: #6b655c; --line: #e4dfd5; --accent: #9a5a12; --todo-bg: #ffe7a3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0d1a; --text: #f1eee8; --muted: #a8a39b; --line: #2a2a3a; --accent: #ffc775; --todo-bg: #6b4a00; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  line-height: 1.8; font-size: 16px; -webkit-text-size-adjust: 100%;
}
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
header { margin-bottom: 28px; }
header a { color: var(--muted); text-decoration: none; font-size: 14px; }
h1 { font-size: 26px; line-height: 1.4; margin: 8px 0 4px; }
h2 { font-size: 19px; margin: 36px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 24px 0 4px; }
p, li { overflow-wrap: anywhere; }
ul { padding-left: 1.3em; }
a { color: var(--accent); }
.lead { color: var(--muted); }
.links { list-style: none; padding: 0; }
.links li { margin: 10px 0; }
.links a { font-size: 17px; }
mark.todo { background: var(--todo-bg); color: inherit; padding: 0 4px; border-radius: 3px; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>Kanzo OK</h1>
<p class="lead">飲んでいる今を見える化し、楽しい時間をできるだけ長く保つための iPhone アプリです。飲酒を禁止・評価するアプリではありません。表示はすべて推定の目安であり、医療機器ではありません。20歳以上の方向けです。</p>
<ul class="links">
<li><a href="support.html">サポート・よくある質問</a></li>
<li><a href="privacy.html">プライバシーポリシー</a></li>
</ul>
<footer>Kanzo OK</footer>
</main>
</body>
</html>
